<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Agent Bridge</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="metrics.js"></script>
  <script defer src="renderer.js"></script>
</head>
<body>
  <div class="panel" id="panel">
    <header id="header">
      <div class="grip" title="Arrastrar ventana" aria-hidden="true"></div>
      <img class="brand-icon" src="../assets/agent-bridge-64.png" alt="" width="28" height="28">
      <div class="heading">
        <h1>Agent Bridge</h1>
        <p id="summary">Conectando…</p>
      </div>
      <time id="updated" aria-label="Última actualización"></time>
      <button id="toggle" type="button" aria-controls="content" aria-expanded="true" aria-label="Contraer resumen">
        <span aria-hidden="true">⌃</span>
      </button>
      <button id="close" type="button" aria-label="Cerrar widget" title="Cerrar widget">
        <span aria-hidden="true">×</span>
      </button>
    </header>
    <main id="content">
      <section id="detail-view" hidden aria-label="Actividad del agente">
        <div class="detail-toolbar"><button id="detail-back" type="button">← Volver</button><strong id="detail-title"></strong><span id="live-indicator">● En vivo</span></div>
        <div id="detail-status"></div>
        <section id="detail-controls" aria-label="Controles del agente">
          <div id="worker-controls"><label>Modelo<select id="model-select"></select></label><button id="apply-model" type="button">Aplicar</button><label>Esfuerzo<select id="effort-select"></select></label><button id="apply-effort" type="button">Aplicar</button><small id="next-order-note">Modelo y esfuerzo se aplican desde la próxima orden.</small><small id="control-security-note" hidden>Abre el widget desde la sesión admin para gestionar workers.</small><button id="compact-worker" type="button">Compactar ahora</button></div>
          <p id="admin-controls-note" hidden>La sesión admin es interactiva. Usa /model o /compact en tu terminal.</p><button id="copy-compact" type="button" hidden>Copiar /compact</button>
          <small id="control-feedback" role="status"></small>
        </section>
        <nav id="feed-filters" class="feed-filters" aria-label="Filtrar conversación" hidden></nav>
        <button id="new-events" type="button" hidden></button>
        <div id="detail-events"></div>
      </section>
      <dialog id="confirm-action"><p id="confirm-message"></p><div><button id="confirm-cancel" type="button">Cancelar</button><button id="confirm-accept" type="button">Confirmar</button></div></dialog>
      <div id="update-banner" role="status" hidden><span id="update-text"></span><button id="update-apply" type="button">Actualizar</button></div>
      <p id="connection" role="status" hidden>Sin conexión con el bridge</p>
      <div id="agents">
        <section id="admins" class="agent-list" aria-label="Administración"></section>
        <section id="group-working" class="agent-group">
          <button class="group-toggle" id="toggle-working" type="button" aria-controls="list-working" aria-expanded="true">
            <span class="group-title">Trabajando</span><span class="group-count" id="count-working">0</span><span class="group-chevron" aria-hidden="true"></span>
          </button>
          <div class="group-list" id="list-working"></div>
        </section>
        <section id="group-free" class="agent-group">
          <button class="group-toggle" id="toggle-free" type="button" aria-controls="list-free" aria-expanded="false">
            <span class="group-title">Libres</span><span class="group-count" id="count-free">0</span><span class="group-chevron" aria-hidden="true"></span>
          </button>
          <div class="group-list" id="list-free" hidden></div>
        </section>
      </div>
    </main>
    <p class="sr-only" id="announcement" role="status"></p>
  </div>
</body>
</html>
