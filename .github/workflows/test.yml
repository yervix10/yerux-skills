name: test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of the installer scripts
        run: for f in install.sh get.sh lib/ui.sh; do bash -n "$f"; done
      - name: Installer works without the agent-bridge project
        run: ./install.sh --dry-run --yes --skills none
  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null; [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { Write-Host "$($_.FullName):$($e.Extent.StartLineNumber) $($e.Message)"; $bad++ } }
          if ($bad) { exit 1 }
